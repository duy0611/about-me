# Overlay: Nordea, Tech Lead, Data Mesh and AI Platforms
# Emphasizes AI platform services, multi-cloud IaC, identity, and developer experience.

meta:
  headline: Staff Platform Engineer (Cloud & AI Platforms)

summary: |
  Platform engineer with over 15 years in software engineering, the last eight in
  cloud infrastructure and reliability on GCP and AWS. I build and run
  multi-cloud platforms for product teams, provisioned with Terraform and
  changed through code review. I have led a platform engineering team and now
  set technical direction while staying hands-on. On
  the AI side I run our internal LLM gateway (LiteLLM on Vertex AI, with per-team
  keys, budgets, and usage logs) and write the agent skills and MCP servers our
  engineers use for platform work. Earlier I built production infrastructure for
  ML and NLP workloads.

