      - GCP IAM & JIT access groups
      - Workload Identity Federation / OIDC
      - Secret Manager & External Secrets
      - Cloud KMS (CMEK)
      - Kyverno, RBAC & Network Policies
  - group: Infrastructure as Code & CI/CD
