# Overlay: Backend Developer (Java / Spring / microservices)
# Emphasizes application engineering roots — Wapice, Witrafi, LIFESUP.

meta:
  headline: Lead Backend Engineer (Java / Spring / Microservices)

summary: |
  Backend engineer with 10+ years shipping production services in Java, Spring
  Boot, and Python. I built ERP integrations at Wapice and microservices platforms
  at Witrafi, and owned the product as CTO and co-founder at LIFESUP. I've also
  spent 6+ years running the infrastructure those services run on (AWS, GCP,
  Kubernetes, Terraform), which shapes how I write code: easy to operate, easy to
  observe, and cheap to change. I work on everything from API design and data
  modeling to CI/CD and the cloud runtime.

