# Overlay: Site Reliability Engineer
# Emphasizes reliability, observability, incident response, and on-call.

meta:
  headline: Lead Site Reliability Engineer

summary: |
  Site Reliability Engineer with 6+ years running production infrastructure on
  AWS and GCP. I turn noisy, high-risk operations into SLO-backed, self-healing
  systems. That work covers incident response procedures and on-call rotations as
  well as reliability guardrails written as Terraform and Kubernetes controllers
  (Config Connector, ACK). I own telemetry, alerting, error budgets, capacity
  planning, and post-incident reviews. I mentor engineers on reliability practice
  and drive company-wide standards for observability and change safety.

competencies:
  - group: Reliability & Operations
    items:
      - SLI / SLO / Error Budgets
      - Incident Response & Post-mortems
      - On-call & Escalation
      - Observability & Telemetry
      - Capacity Planning
      - Chaos & Failure Testing
  - group: Cloud & Infrastructure
    items:
      - AWS
      - Google Cloud Platform (GCP)
      - Multi-Cloud Architecture
      - DigitalOcean
  - group: Infrastructure as Code & Automation
    items:
      - Terraform
      - Ansible
      - Packer
      - Jenkins
      - GitHub Actions
      - Kubernetes
      - Helm
      - Docker
      - ArgoCD
      - GitOps
  - group: Programming & Scripting
    items:
      - Python
      - Shell / Bash
      - Java
      - Golang
  - group: Identity, Security & Governance
    items:
      - IAM policies
      - SSO / OIDC
      - Access Governance
      - Security Guardrails
