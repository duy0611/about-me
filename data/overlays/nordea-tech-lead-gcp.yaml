# Overlay: Nordea, Tech Lead GCP Infrastructure, Data Mesh and AI Platforms
# Emphasizes GCP foundations, IAM, Terraform, Vertex AI, and team leadership.

meta:
  headline: Staff Platform Engineer (GCP)

summary: |
  Platform engineer with over 15 years in software engineering, the last eight in
  cloud infrastructure and reliability on GCP and AWS. I build and run GCP
  foundations for product teams, from the organization and landing zone to
  networking and access, provisioned with Terraform and changed through code
  review. I have led a platform engineering team and now set technical direction
  while staying hands-on with Terraform and CI/CD. I also run our internal LLM gateway on Vertex AI, and earlier built
  production infrastructure for ML and NLP workloads.

