# Overlay: Platform Engineering
# Emphasizes IDPs, golden paths, self-service, developer experience.

meta:
  headline: Staff Platform Engineer

summary: |
  Platform Engineer who builds Internal Developer Platforms so product teams can
  ship safely without waiting on ops. For 6+ years I've designed golden paths on
  AWS and GCP: reusable Terraform modules and Kubernetes-native abstractions
  (Config Connector, ACK) that replace one-off tickets with self-service
  workflows. Most of my work sits where developer experience, security, and cost
  meet. I write paved-road tooling, mentor engineers, and set technical standards
  so the safe path is also the easy one. I've worked hands-on with AI/ML systems
  and help teams adopt AI-assisted development safely.

