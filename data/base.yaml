summary: |
  Platform Engineer with over 15 years in software engineering, the last eight in
  cloud infrastructure, reliability, and DevOps. I have led a platform
  engineering team and now set technical direction while staying hands-on. I
  design and run internal developer platforms on GCP and AWS, provisioned with
  Terraform and Kubernetes-native controllers (Config Connector, ACK). I turn
  manual, high-risk operations into reusable templates, and access goes through
  pull request review. I also run an internal LLM gateway on Vertex AI and have
  built production infrastructure for ML and NLP workloads.

