summary: |
  Platform Engineer with over 15 years in software engineering and the last six in
  cloud infrastructure, reliability, and DevOps. I manage and provision 17+ Kubernetes
  clusters, 100+ GCP projects, and 5+ AWS accounts serving more than 100 engineers,
  using Terraform and Kubernetes-native controllers (Config Connector, ACK).
  I help architect and build our internal developer platform, and turn manual,
  high-risk operations into reusable templates and access that gets reviewed in a
  pull request rather than granted by hand. I've also built and
  run production infrastructure for ML and NLP workloads. I mentor engineers, run
  architectural reviews, and set technical standards.

