summary: |
  Platform Engineer with over 15 years in software engineering, the last six in
  cloud infrastructure, reliability, and DevOps. I manage and provision 17+ Kubernetes
  clusters, 100+ GCP projects, and 5+ AWS accounts used by more than 100 engineers,
  with Terraform and Kubernetes-native controllers (Config Connector, ACK).
  I help design and build our internal developer platform. I turn manual, high-risk
  operations into reusable templates, and access now goes through pull request
  review instead of being granted by hand. I've also built and run production
  infrastructure for ML and NLP workloads. I mentor engineers, run architectural
  reviews, and set technical standards.

