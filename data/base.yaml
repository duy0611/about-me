summary: |
  Highly autonomous and results-driven Staff Platform Engineer with over 10 years of
  software engineering experience and 6+ years specializing in Cloud Infrastructure,
  Site Reliability, and DevOps. Proven track record of designing and provisioning
  large-scale, multi-cloud infrastructure (AWS, GCP) using Terraform and Ansible.
  Passionate about building "golden paths," automated self-service pipelines, and
  robust security guardrails that empower developer teams to work securely and
  efficiently. Uniquely positioned to enable safe AI-assisted development, combining
  deep technical mastery of cloud architecture with an academic and practical
  background in AI/ML and NLP systems. A humble and collaborative leader who thrives
  on mentoring engineers, leading architectural reviews, and driving technical
  standards in high-autonomy environments.

